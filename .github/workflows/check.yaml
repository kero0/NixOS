name: "OS build check"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwinConfigurations.Kirolss-MacBook-Pro.system
            os: macos-15
            free-space: false
          - target: homeConfigurations.kirolsb.activationPackage
            os: ubuntu-latest
            free-space: false
          - target: nixosConfigurations.Kirols-xps9575.config.system.build.toplevel
            os: ubuntu-latest
            free-space: true
          - target: nixosConfigurations.justice.config.system.build.toplevel
            os: ubuntu-latest
            free-space: true
          - target: nixosConfigurations.theater.config.system.build.toplevel
            os: ubuntu-latest
            free-space: true
          - target: nixosConfigurations.tang.config.system.build.toplevel
            os: ubuntu-24.04-arm
            free-space: false
          - target: nixosConfigurations.hass.config.system.build.toplevel
            os: ubuntu-latest
            free-space: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        if: ${{ matrix.free-space }}
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          extra-conf: |
            extra-experimental-features = flakes nix-command recursive-nix pipe-operators

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: kero0
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: nix-community

      - name: Check OS build
        id: build
        shell: bash
        run: |
          result=$(nix build --accept-flake-config --show-trace --print-out-paths --no-link -L .#${{ matrix.target }})
          res=$?

          echo "result=$result" >> $GITHUB_OUTPUT
          if [ $res -eq 0 ]; then
            echo "build_result=success" >> $GITHUB_OUTPUT
          else
            echo "build_result=failure" >> $GITHUB_OUTPUT
            exit $res
          fi

      - name: Diff profile
        id: diff
        run: |
          {
            new_path="${{ steps.build.outputs.result }}"
            echo "new_path=$new_path" >> $GITHUB_OUTPUT
            # compare with the base commit, not with this checkout
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if ! old_path=$(nix eval --accept-flake-config --raw "github:${{ github.repository }}/$base#${{ matrix.target }}"); then
              # e.g. the target doesn't evaluate on the base (hass before this change)
              echo "body=Could not evaluate ${{ matrix.target }} at $base; no diff."
              exit 0
            fi
            echo 'body<<EOF'
            echo "# ${{ matrix.target }} changes"


            nix store diff-closures --accept-flake-config --derivation \
                "$old_path" \
                "$new_path" | sed 's/\x1b\[[0-9;]*m//g'
            res=$?

            echo 'EOF'
          } >> $GITHUB_OUTPUT
          if [ $res -eq 0 ]; then
            echo "diff_result=success" >> $GITHUB_OUTPUT
          else
            echo "diff_result=failure" >> $GITHUB_OUTPUT
            exit $res
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BODY: ${{ steps.diff.outputs.body }}
        with:
          script: |
            const body = process.env.BODY;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment on commit
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BODY: ${{ steps.diff.outputs.body }}
        with:
          script: |
            const body = process.env.BODY;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });

  eval-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          extra-conf: |
            extra-experimental-features = flakes nix-command recursive-nix pipe-operators

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: kero0
          extraPullNames: nix-community

      - name: Evaluate images and run flake checks
        shell: bash
        run: |
          set -euo pipefail
          for t in images.x86_64-linux-iso.config.system.build.isoImage images.tang packages.x86_64-linux.mk-tang-sd; do
            echo "::group::$t"
            nix eval --accept-flake-config --raw ".#$t.drvPath"
            echo "::endgroup::"
          done
          nix build --accept-flake-config --no-link -L .#checks.x86_64-linux.pre-commit-check

  builds-passed:
    name: All builds succeeded
    needs:
      - build-check
      - eval-check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.build-check.result }}" != "success" ] || [ "${{ needs.eval-check.result }}" != "success" ]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed"
